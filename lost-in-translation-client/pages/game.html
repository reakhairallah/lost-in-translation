<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>Start Round</title>
		<link rel="stylesheet" href="/lost-in-translation/lost-in-translation-client/styles/style.css"/>
	</head>
	<body>
		<div class="app">
			<div class="chase"></div>

			<header class="topbar">
				<div class="brand">
					<a href="/lost-in-translation/lost-in-translation-client/index.html" class="logo">
						Lost in Translation
					</a>
					<span class="round-tag" id="round-id-display"></span>
				</div>
				<a href="/lost-in-translation/lost-in-translation-client/pages/hall-of-fame.html" class="nav-link">
					Hall of Fame &rarr;
				</a>
			</header>

			<main class="main">
				<div class="game-wrap">
					<section id="loading-screen" class="screen">
						<div class="loading-screen">
							<div class="spinner"></div>
							<p>Translating through 6 languages...</p>
						</div>
					</section>

					<section id="round-screen" class="screen">
						<div class="round-top">
							<div class="wheel" id="wheel">
								<div class="wheel-face"><span id="timer">60</span></div>
							</div>
							<div class="booth">
								<p id="mangled-sentence">Loading...</p>
							</div>
						</div>

						<p class="label">Your guess</p>
						<form id="guess-form">
							<input
								type="text"
								id="guess-input"
								placeholder="What was the original sentence?"
								autocomplete="off"
								required
							/>
							<button type="submit" class="btn-primary">Guess</button>
						</form>

						<div id="board" class="board"></div>

						<div class="hint-row">
							<button id="hint-btn" class="btn-secondary">Use Hint (-30 pts)</button>
						</div>
						<div id="hint-display" class="hint-display"></div>
					</section>

					<section id="reveal-screen" class="screen">
						<h2>The Chain of Destruction</h2>

						<div class="reveal-original">
							<p class="label">What the sentence actually said</p>
							<p id="reveal-original-text"></p>
						</div>

						<p class="label">The journey, translation by translation</p>
						<div id="reveal-steps" class="reveal-steps"></div>

						<div id="mangle-score-display" class="mangle-score">
							<div class="score-flash">
								<span class="num" id="mangle-num">0</span>
								<span class="cap">Mangle score</span>
							</div>
						</div>

						<p class="start-round-note">This round already ended — start the next one when you're ready.</p>
						<div id="reveal-error" class="error-text"></div>
						<button id="play-again-btn" class="btn-primary">Start Round</button>
					</section>
				</div>
			</main>

			<div class="chase"></div>
		</div>

		<script src="/lost-in-translation/lost-in-translation-client/scripts/axios.min.js"></script>
		<script src="/lost-in-translation/lost-in-translation-client/scripts/game.js"></script>
	</body>
</html>
